services:
  - type: web
    name: rohit-portfolio-backend
    env: node
    rootDir: server
    buildCommand: npm install && node scripts/generate-resumes.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
